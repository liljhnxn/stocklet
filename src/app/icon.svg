  <!-- Inner Detail Seam Lines -->
  <path d="M16 6.5 L16 15.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.6"/>
  <path d="M7.5 11 L16 15.5 L24.5 11" stroke="rgba(255,255,255,0.25)" stroke-width="0.6"/>
