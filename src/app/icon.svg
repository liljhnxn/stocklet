  </defs>
  <!-- Rounded Base Icon Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="rgba(139,92,246,0.3)"/>
  
  <!-- 3D Inventory Package -->
  <!-- Top Face -->
